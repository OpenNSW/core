name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # STAGE 1: Fast checks.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: './go.mod'
          cache-dependency-path: go.sum
          cache: true

      - name: Verify go.mod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2
          args: --timeout=5m

      - name: Verify license headers
        run: |
          go install github.com/google/addlicense@latest
          "$(go env GOPATH)/bin/addlicense" -check \
            -f .github/license-header.tmpl \
            -ignore '**/vendor/**' \
            $(find . -type f -name '*.go' -not -path './vendor/*')

  # STAGE 2: Heavy Logic.
  test-and-security:
    name: Test & Security
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: './go.mod'
          cache-dependency-path: go.sum
          cache: true

      - name: Run Tests (includes build)
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.out
          flags: backend
        continue-on-error: true

      - name: Run Gosec
        uses: securego/gosec@v2.29.0
        with:
          args: -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: results.sarif
        if: always()

  # The remote/ package is its own Go module, so the root ./... jobs above do not
  # cover it. Run its quality checks and tests independently.
  remote-module:
    name: Remote Module
    runs-on: ubuntu-latest
    permissions:
