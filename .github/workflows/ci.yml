        with:
          version: v2.11.2
          args: --timeout=5m
          working-directory: refid

      - name: Run Tests (includes build)
        env:
          POSTGRES_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=refid_test sslmode=disable"
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

  # STAGE 3: Parallel security + vuln scans.
  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks dir . --redact --no-banner
